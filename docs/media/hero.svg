<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">LiverSira AI</title>
  <desc id="desc">Animated banner: a stylised liver is scanned while lesions pulse, next to the project name and its two pipelines, NLP on radiology reports and CV on liver ultrasound.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1a1235"/>
    </linearGradient>
    <linearGradient id="liver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4533a"/>
      <stop offset="1" stop-color="#6e2a2a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#93c5fd"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ccfbf1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="liverClip">
      <path id="liverShape" d="M70 120 C62 70 120 40 205 42 C270 44 330 58 352 82 C366 98 356 116 330 128 C292 146 250 176 200 206 C160 230 112 234 90 206 C76 188 74 156 70 120 Z"/>
    </clipPath>
    <clipPath id="typeClip">
      <rect x="470" y="196" width="0" height="34">
        <animate attributeName="width" values="0;0;690;690;0" keyTimes="0;0.08;0.55;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .muted { fill:#94a3b8; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
      .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace; }
      .scanbar { animation: scan 3.6s cubic-bezier(.45,0,.55,1) infinite; }
      @keyframes scan { 0% { transform: translateY(-70px); } 100% { transform: translateY(250px); } }
      .lesion { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
      .lesion.b { animation-delay: .8s; }
      .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
      .ring.b { animation-delay: .8s; }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
      @keyframes ring { 0% { transform: scale(.6); opacity:.9; } 100% { transform: scale(2.6); opacity:0; } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      .chip { opacity:0; animation: chipIn .8s ease-out forwards; }
      .chip.c2 { animation-delay: .35s; } .chip.c3 { animation-delay: .7s; }
      @keyframes chipIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity:0; } }
      .orbit { transform-origin: 211px 140px; animation: spin 18s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .scanbar, .lesion, .ring, .float, .caret, .orbit { animation: none; }
        .chip { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <circle cx="211" cy="140" r="170" fill="url(#glow)"/>

  <!-- orbiting dashed ring -->
  <g class="orbit">
    <circle cx="211" cy="140" r="128" fill="none" stroke="#5eead4" stroke-opacity="0.25" stroke-dasharray="3 10"/>
    <circle cx="339" cy="140" r="4" fill="#5eead4"/>
    <circle cx="83" cy="140" r="3" fill="#c4b5fd"/>
  </g>

  <!-- liver -->
  <g class="float">
    <use href="#liverShape" fill="url(#liver)" stroke="#f0a08a" stroke-opacity="0.55" stroke-width="2"/>
    <g clip-path="url(#liverClip)">
      <!-- Couinaud-style segment guides -->
      <g stroke="#ffd6c9" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="5 6" fill="none">
        <path d="M205 30 L180 240"/>
        <path d="M60 128 L360 104"/>
        <path d="M262 40 L250 200"/>
        <path d="M130 40 L120 230"/>
      </g>
      <circle class="lesion" cx="150" cy="96" r="13" fill="#2b0f14" stroke="#fda4af" stroke-width="2"/>
      <circle class="ring" cx="150" cy="96" r="13" fill="none" stroke="#fda4af" stroke-width="2"/>
      <circle class="lesion b" cx="236" cy="150" r="8" fill="#2b0f14" stroke="#fda4af" stroke-width="2"/>
      <circle class="ring b" cx="236" cy="150" r="8" fill="none" stroke="#fda4af" stroke-width="2"/>
      <g class="scanbar">
        <rect x="40" y="-10" width="340" height="60" fill="url(#scan)"/>
        <rect x="40" y="48" width="340" height="2" fill="#ccfbf1"/>
      </g>
    </g>
    <!-- measurement callout -->
    <g stroke="#fda4af" stroke-width="1.5" fill="none" opacity="0.9">
      <path d="M137 96 H163" stroke-dasharray="2 3"/>
      <path d="M150 82 L120 60 H88"/>
    </g>
    <text x="86" y="54" class="mono" font-size="12" fill="#fecdd3">seg 7 · 3.2 cm</text>
  </g>

  <!-- title block -->
  <text x="470" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="64" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1">LiverSira AI</text>
  <text x="472" y="150" class="muted" font-size="20">Radiology reports → structured liver-lesion features</text>
  <text x="472" y="178" class="muted" font-size="20">Liver ultrasound → HCC vs Hemangioma</text>

  <!-- typed structured output -->
  <g clip-path="url(#typeClip)">
    <text x="472" y="219" class="mono" font-size="16" fill="#5eead4">{ has_lesion: true, lesion_count: 2, segments: [7], diameter_cm: 3.2 }</text>
  </g>
  <rect class="caret" x="470" y="203" width="9" height="20" fill="#5eead4" opacity="0.8">
    <animate attributeName="x" values="470;470;1160;1160;470" keyTimes="0;0.08;0.55;0.92;1" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- chips -->
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600">
    <g class="chip c1">
      <rect x="472" y="244" width="150" height="28" rx="14" fill="#5eead4" fill-opacity="0.12" stroke="#5eead4" stroke-opacity="0.5"/>
      <text x="547" y="263" text-anchor="middle" fill="#99f6e4">NLP · AbdomenAtlas</text>
    </g>
    <g class="chip c2">
      <rect x="634" y="244" width="140" height="28" rx="14" fill="#93c5fd" fill-opacity="0.12" stroke="#93c5fd" stroke-opacity="0.5"/>
      <text x="704" y="263" text-anchor="middle" fill="#bfdbfe">CV · SMC-LUD</text>
    </g>
    <g class="chip c3">
      <rect x="786" y="244" width="196" height="28" rx="14" fill="#c4b5fd" fill-opacity="0.12" stroke="#c4b5fd" stroke-opacity="0.5"/>
      <text x="884" y="263" text-anchor="middle" fill="#ddd6fe">evidence-backed · frozen</text>
    </g>
  </g>
</svg>
