  <text x="40" y="366" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#93c5fd">CV · LIVER ULTRASOUND → HCC vs HEMANGIOMA</text>
