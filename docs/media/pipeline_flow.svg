<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">LiverSira AI pipelines</title>
  <desc id="desc">Animated diagram of the two pipelines. NLP: AbdomenAtlas 3.0 Mini reports are audited and cleaned, split into frozen Train, Validation and Test sets, reduced to liver-only text, and passed to the frozen extraction candidates (parser v1.1, parser v1.2, ClinicalBERT extractor, hybrid H) and presence candidates (TF-IDF with logistic regression, ClinicalBERT); Phase 7 API LLMs are references only. All candidates go to the single Phase 8 run, which awaits Challenge-B and the Gold Set. CV: SMC-LUD ultrasound images, a patient-level manifest, a checksum-verified split, native-aspect preprocessing and a ResNet18 baseline notebook with no recorded results yet.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="0.6" stop-color="#111a33"/><stop offset="1" stop-color="#1a1235"/></linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c4b5fd" stop-opacity="0"/><stop offset=".5" stop-color="#c4b5fd" stop-opacity=".07"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#5eead4" flood-opacity=".45"/></filter>
    
  <path id="pNlp" d="M130 150 H1090" fill="none"/>
  <path id="pPres" d="M470 150 V292 H760" fill="none"/>
  <path id="pLlm" d="M640 182 V226" fill="none"/>
  <path id="pCv" d="M130 430 H1000" fill="none"/>
    <style>
      .flow { fill:none; stroke-width:2.2; stroke-opacity:.55; stroke-dasharray:7 9; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset:-16; } }
      .node { animation: glow 3s ease-in-out infinite; }
      @keyframes glow { 0%,100% { filter:none; } 50% { filter:url(#soft); } }
      .await { animation: wait 1.8s ease-in-out infinite; }
      @keyframes wait { 0%,100% { opacity:1; } 50% { opacity:.45; } }
      .sweep { animation: sweep 4s ease-in-out infinite; }
      @keyframes sweep { 0% { opacity:0; } 50% { opacity:1; } 100% { opacity:0; } }
      @media (prefers-reduced-motion: reduce) { .flow, .node, .await, .sweep { animation:none; } .dot { display:none; } }
    </style>
  </defs>
  <rect width="1200" height="530" rx="22" fill="url(#bg)"/>
    <rect x="20" y="28" width="1160" height="292" rx="18" fill="#5eead4" fill-opacity=".03" stroke="#5eead4" stroke-opacity=".18"/>
  <rect x="20" y="338" width="1160" height="170" rx="18" fill="#93c5fd" fill-opacity=".03" stroke="#93c5fd" stroke-opacity=".18"/>
