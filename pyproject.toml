[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "liversira-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.1.0",
    "numpy==2.5.4",
    "pydantic==2.14.2",
    "scikit-learn==1.9.1",
    "Pillow==13.0.0",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "transformers==5.22.2",
    "accelerate==1.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
