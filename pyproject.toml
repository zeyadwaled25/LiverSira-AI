[project]
name = "liversira-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.1.0",
    "numpy==2.5.4",
    "pydantic==2.14.2",
    "scikit-learn==1.9.1",
    "pytest==9.2.0",
    "Pillow==12.0.0",
    "torch==2.9.1",
    "torchvision==0.24.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
